name: Node.js Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_force_fix:
        description: 'Run pnpm update to attempt vulnerability fixes?'
        required: false
        default: 'false'

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm and corepack
        run: |
          npm install -g pnpm@10 corepack@latest
          pnpm --version

      - name: Cache pnpm dependencies and toolchain
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ~/.pnpm-store
            ~/.local/share/pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Run pnpm audit fix (update vulnerable packages)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.run_force_fix }}" = "true" ]; then
            echo "Running pnpm update (force)"
            pnpm update --latest
          else
            echo "Running pnpm update"
            pnpm update
          fi
        continue-on-error: true

      - name: Run pnpm audit and save report
        run: |
          mkdir -p .temp
          pnpm audit --audit-level=low --json > .temp/audit-results.json
        continue-on-error: true

      - name: Parse audit results and set outputs
        id: audit
        run: |
          if [ -f .temp/audit-results.json ]; then
            HIGH=$(jq '.metadata.vulnerabilities.high' .temp/audit-results.json)
            CRITICAL=$(jq '.metadata.vulnerabilities.critical' .temp/audit-results.json)
          else
            HIGH=0
            CRITICAL=0
          fi
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"

      - name: Create Issue for high/critical vulnerabilities
        if: ${{ steps.audit.outputs.high != '0' || steps.audit.outputs.critical != '0' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const high = Number('${{ steps.audit.outputs.high }}');
            const critical = Number('${{ steps.audit.outputs.critical }}');
            const title = `Security Alert: ${critical > 0 ? `${critical} critical ` : ''}${high > 0 ? `${high} high ` : ''}vulnerabilities detected by npm audit`;

            const fs = require('fs');
            let audit = '';
            try {
              audit = fs.readFileSync('.temp/audit-results.json', 'utf8').slice(0, 6000);
            } catch (error) {
              audit = 'No audit-results.json';
            }

            const issueBody = [
              'npm audit detected:',
              `- **${critical} critical**`,
              `- **${high} high** vulnerability(ies)`,
              '',
              '```json',
              audit,
              '```'
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security, automated'
            });

            const exists = issues.find(issue => issue.title.includes('Security Alert') && issue.state === 'open');
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody,
                labels: ['security', 'automated']
              });
            } else {
              console.log('Security alert issue already exists; skipping duplicate.');
            }

      - name: Create Pull Request for patched audit results
        if: ${{ steps.audit.outputs.high != '0' || steps.audit.outputs.critical != '0' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: pnpm audit fix for high/critical vulnerabilities'
          branch: audit-fix/${{ github.run_id }}
          title: 'chore: pnpm audit fix for high/critical vulnerabilities'
          body: |
            This PR applies `pnpm update` in an attempt to resolve high/critical vulnerabilities.
            See audit summary in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: security, automated
          delete-branch: true

      - name: Fail if unresolved high or critical vulnerabilities remain
        if: ${{ steps.audit.outputs.high != '0' || steps.audit.outputs.critical != '0' }}
        run: |
          echo "High or critical vulnerabilities remain. Please address these issues."
          exit 1

