name: Bookmarklet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test, and Verify Bookmarklet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm and corepack
        run: |
          npm install -g pnpm@10 corepack@latest
          pnpm --version

      - name: Cache pnpm dependencies and toolchain
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ~/.pnpm-store
            ~/.local/share/pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source syntax
        run: node --check src/webbender.js

      - name: Build bookmarklet artifact
        run: pnpm run build:bookmarklet

      - name: Build main bundle
        run: pnpm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: pnpm test

      - name: Upload Playwright report artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Verify bookmarklet size
        run: |
          node -e "const fs=require('fs');const path=require('path');const size=fs.statSync(path.join('dist','bookmarklet.min.js')).size; if(size>102400){throw new Error('Bookmarklet exceeds 100KB: '+size+' bytes');} console.log('✓ Bookmarklet size is', size, 'bytes');"

      - name: Commit generated bookmarklet
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/bookmarklet.min.js dist/bookmarklet.url
          if ! git diff --cached --quiet; then
            git commit -m "chore: update generated bookmarklet.min.js and bookmarklet.url"
            git push origin HEAD
          else
            echo "No generated bookmarklet changes to commit."
          fi

  report:
    name: Echo Playwright Results
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Playwright report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Echo test results summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const resultsPath = path.join('playwright-report', 'results.json');
          if (!fs.existsSync(resultsPath)) {
            console.error('No Playwright results.json found at', resultsPath);
            process.exit(1);
          }
          const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
          const counts = { total: 0, passed: 0, failed: 0, skipped: 0, timedOut: 0, flaky: 0, expected: 0, unexpected: 0 };
          function walk(node) {
            if (!node) return;
            if (Array.isArray(node.tests)) {
              for (const test of node.tests) {
                counts.total += 1;
                const status = test.status || 'unknown';
                counts[status] = (counts[status] || 0) + 1;
                if (test.expected === false) counts.unexpected += 1;
                if (test.expected === true) counts.expected += 1;
                if (test.annotations && test.annotations.some(a => a.type === 'flaky')) counts.flaky += 1;
              }
            }
            if (Array.isArray(node.suites)) node.suites.forEach(walk);
          }
          walk(results);
          console.log('Playwright test summary:');
          console.log(`  Total:      ${counts.total}`);
          console.log(`  Passed:     ${counts.passed}`);
          console.log(`  Failed:     ${counts.failed}`);
          console.log(`  Skipped:    ${counts.skipped}`);
          console.log(`  Timed out:  ${counts.timedOut}`);
          console.log(`  Flaky:      ${counts.flaky}`);
          console.log(`  Expected:   ${counts.expected}`);
          console.log(`  Unexpected: ${counts.unexpected}`);
          NODE
